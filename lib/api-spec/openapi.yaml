    PlaybookTopicPrompt:
      type: object
      required: [id, text, active, runCount, lastVisibilityPct, lastRunAt]
      properties:
        id: { type: integer }
        text: { type: string }
        active: { type: boolean }
        runCount: { type: integer }
        lastVisibilityPct: { type: ["number", "null"] }
        lastRunAt: { type: ["string", "null"] }
    PlaybookTopicStrategy:
      type: object
      required: [total, notStarted, inProgress, live]
      properties:
        total: { type: integer }
        notStarted: { type: integer }
        inProgress: { type: integer }
        live: { type: integer }
    PlaybookMoneyTopic:
      type: object
      required: [id, companyId, topic, priority, createdAt, prompts, strategy]
      properties:
        id: { type: integer }
        companyId: { type: integer }
        topic: { type: string }
        question: { type: ["string", "null"] }
        source: { type: ["string", "null"] }
        priority: { type: string, enum: [very_high, high, medium, low] }
        createdAt: { type: string }
        prompts:
          type: array
          items:
            $ref: "#/components/schemas/PlaybookTopicPrompt"
        strategy:
          $ref: "#/components/schemas/PlaybookTopicStrategy"
    PlaybookTopDomain:
      type: object
      required: [domain, domainType, retrievals]
      properties:
        domain: { type: string }
        domainType: { type: string }
        retrievals: { type: integer }
    PlaybookTracking:
      type: object
      required: [promptCount, activePromptCount, runCount, citedDomainCount, topDomains]
      properties:
        promptCount: { type: integer }
        activePromptCount: { type: integer }
        runCount: { type: integer }
        citedDomainCount: { type: integer }
        lastRunAt: { type: ["string", "null"] }
        topDomains:
          type: array
          items:
            $ref: "#/components/schemas/PlaybookTopDomain"
    PlaybookSuggestedWeek:
      type: object
      required: [weekOf, totalPrompts, brandMentions]
      properties:
        weekOf: { type: string }
        totalPrompts: { type: integer }
        brandMentions: { type: integer }
        competitorMentionsAvg: { type: ["number", "null"] }
        shareOfVoicePct: { type: ["number", "null"] }
        topPageType: { type: ["string", "null"] }
    CompanyPlaybook:
      type: object
      required:
        [
          company,
          moneyTopics,
          tracking,
          onsiteItems,
          offsiteItems,
          measurements,
        ]
      properties:
        company:
          $ref: "#/components/schemas/Company"
        moneyTopics:
          type: array
          items:
            $ref: "#/components/schemas/PlaybookMoneyTopic"
        tracking:
          $ref: "#/components/schemas/PlaybookTracking"
        onsiteItems:
          type: array
          items:
            $ref: "#/components/schemas/StrategyItem"
        offsiteItems:
          type: array
          items:
            $ref: "#/components/schemas/StrategyItem"
        measurements:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyMeasurement"
        suggestedWeek:
          $ref: "#/components/schemas/PlaybookSuggestedWeek"
