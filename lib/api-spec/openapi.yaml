          anyOf:
            - $ref: "#/components/schemas/ActionRecommendation"
            - type: "null"
        evidence:
          anyOf:
            - $ref: "#/components/schemas/ActionEvidence"
            - type: "null"
    ActionRecommendation:
      type: object
      description: >-
        Separates the general AEO principle from company-specific prioritisation.
        Verified research is used only when an exact supported Gap finding exists;
        company context is explicitly not presented as outcome evidence.
      required:
        [
          basis,
          evidenceLevel,
          generalPrinciple,
          companyRationale,
          nextStep,
          basedOn,
          findingId,
          promptIds,
        ]
      properties:
        basis:
          type: string
          enum:
            [
              verified_research,
              research_refresh_needed,
              company_context,
              general_strategy,
            ]
        evidenceLevel:
          type: string
          enum:
            [
              verified_observation,
              historical_observation,
              established_practice,
              conditional_practice,
              experimental,
            ]
        generalPrinciple: { type: string }
        companyRationale: { type: ["string", "null"] }
        nextStep: { type: string }
        basedOn:
          type: array
          items: { type: string }
        findingId: { type: ["integer", "null"] }
        promptIds:
          type: array
          items: { type: integer }
    ActionEvidence:
      type: object
      description: >-
        Optional grounding for an action: a company observed surfacing well
        with AI agents, the observed mechanism, and the supporting source.
        Absent for original/visionary actions with no precedent.
      required: [company, evidenceType, observation, confidence]
      properties:
        company: { type: string }
        evidenceType:
          type: string
          enum:
            [
              editorial,
              ugc,
              original_statistics,
              faq_structure,
              documentation,
              review_listicle,
              competitor_owned,
              reference,
              brand_owned,
              other,
            ]
