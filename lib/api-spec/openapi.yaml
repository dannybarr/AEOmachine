          schema: { type: integer }
      responses:
        "204":
          description: Detached
        "404":
          description: Money topic or linked prompt not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /money-topics/{id}:
    delete:
      operationId: deleteMoneyTopic
      tags: [strategy]
      summary: Remove a money topic
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /companies/{id}/measurements:
    post:
      operationId: createWeeklyMeasurement
      tags: [strategy]
      summary: Record a weekly measurement rollup for a company (playbook step 5)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeeklyMeasurementInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyMeasurement"
        "404":
          description: Company not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /measurements/{id}:
    delete:
      operationId: deleteWeeklyMeasurement
      tags: [strategy]
      summary: Remove a weekly measurement row
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
components:
  parameters:
    CompanyId:
      name: companyId
      in: query
      required: true
      schema: { type: integer }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ModelInfo:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        provider: { type: string }
        family: { type: string }
        version: { type: string }
        supportsSearch: { type: boolean }
        available: { type: boolean }
        unavailableReason: { type: ["string", "null"] }
        order: { type: integer }
      required: [id, label, provider, family, version, supportsSearch, available, order]
    Methodology:
      type: object
      required: [days, windowStartUtc, registry, enabledModelCount, prompts, runs, citations, attempts]
      properties:
        days: { type: integer }
        windowStartUtc: { type: string }
        registryValidatedAt: { type: ["string", "null"] }
        enabledModelCount: { type: integer }
        registry:
          type: array
          items:
            type: object
            required: [id, label, provider, supportsSearch, available]
            properties:
              id: { type: string }
              label: { type: string }
              provider: { type: string }
              supportsSearch: { type: boolean }
              available: { type: boolean }
              unavailableReason: { type: ["string", "null"] }
        prompts:
          type: object
          required: [total, active]
          properties:
            total: { type: integer }
            active: { type: integer }
        runs:
          type: object
          required: [total, citationEligible, searchIneligible, legacy]
          properties:
            total: { type: integer }
            citationEligible: { type: integer }
            searchIneligible: { type: integer }
            legacy: { type: integer }
            outcomes:
              type: object
              description: Granular run-outcome breakdown for the window
              required:
                [
                  providerCited,
                  searchNoCitations,
                  extractionFailed,
                  toolRejected,
                  answerOnly,
                  legacySearch,
                ]
              properties:
                providerCited: { type: integer }
                searchNoCitations: { type: integer }
                extractionFailed: { type: integer }
                toolRejected: { type: integer }
                answerOnly: { type: integer }
                legacySearch: { type: integer }
        citations:
          type: object
          required: [total, verified, legacy]
          properties:
            total: { type: integer }
            verified: { type: integer }
            legacy: { type: integer }
        attempts:
          type: object
          required: [total, failed]
          properties:
            total: { type: integer }
            failed: { type: integer }
    JobModelSnapshot:
      type: object
      required: [id, label, provider, supportsSearch]
      properties:
        id: { type: string }
        label: { type: string }
        provider: { type: string }
        supportsSearch: { type: boolean }
    JobModelAttempts:
      type: object
      required: [model, total, succeeded, failed]
      properties:
        model: { type: string }
        total: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        lastError: { type: ["string", "null"] }
    ErrorMessage:
      type: object
      properties:
        error: { type: string }
      required: [error]
    CitationDiagnostics:
      type: object
      description: Structured citation-extraction diagnostics for a run
      required: [metadataEvents, invalidUrls, unknownAnnotationTypes, unknownShapes, redirectsResolved, redirectsFailed]
      properties:
        extracted: { type: integer }
        metadataEvents: { type: integer }
        invalidUrls: { type: integer }
        unknownAnnotationTypes:
          type: array
          items: { type: string }
        unknownShapes: { type: integer }
        redirectsResolved: { type: integer }
        redirectsFailed: { type: integer }
        observedShapes:
          type: array
          items: { type: string }
          description: Recognized citation metadata shapes that produced at least one metadata event
        seenCitationKeys:
          type: array
          items: { type: string }
          description: Citation-related keys observed on the stream, including empty payloads
        unparsedCitationKeys:
          type: array
          items: { type: string }
          description: Citation-like keys whose structure could not be parsed into URLs
    CitationQualityModel:
      type: object
      required: [model, label, inRegistry, runs, outcomes, citationEligibleRuns, verifiedCitations, zeroCitationEligibleRuns]
      properties:
        model: { type: string }
        label: { type: string }
        provider: { type: ["string", "null"] }
        supportsSearch: { type: ["boolean", "null"] }
        available: { type: boolean }
        unavailableReason: { type: ["string", "null"] }
        inRegistry: { type: boolean }
        runs: { type: integer }
        outcomes:
          type: object
          required: [providerCited, searchNoCitations, extractionFailed, toolRejected, answerOnly, legacySearch, legacy]
          properties:
            providerCited: { type: integer }
            searchNoCitations: { type: integer }
            extractionFailed: { type: integer }
            toolRejected: { type: integer }
            answerOnly: { type: integer }
            legacySearch: { type: integer }
            legacy: { type: integer }
        citationEligibleRuns: { type: integer }
        verifiedCitations: { type: integer }
        zeroCitationEligibleRuns: { type: integer }
        lastRunAt: { type: ["string", "null"], format: date-time }
    CitationQualityReport:
      type: object
      required: [days, windowStartUtc, models]
      properties:
        days: { type: integer }
        windowStartUtc: { type: string, format: date-time }
        models:
          type: array
          items:
            $ref: "#/components/schemas/CitationQualityModel"
    ModelAuditResult:
      type: object
      required: [model, provider, label, supportsSearch, extraction, outcome, answerChars, citationCount, sampleDomains, urlsChecked, urlsOk]
      properties:
        model: { type: string }
        provider: { type: string }
        label: { type: string }
        supportsSearch: { type: boolean }
        extraction: { type: string }
        outcome: { type: string, enum: [completed, failed, unavailable] }
        unavailableReason: { type: ["string", "null"] }
        searchStatus: { type: ["string", "null"] }
        citationEligible: { type: ["boolean", "null"] }
        answerChars: { type: integer }
        citationCount: { type: integer }
        sampleDomains:
          type: array
          items: { type: string }
        urlsChecked: { type: integer }
        urlsOk: { type: integer }
        diagnostics:
          oneOf:
            - $ref: "#/components/schemas/CitationDiagnostics"
            - type: "null"
        durationMs: { type: ["integer", "null"] }
        error: { type: ["string", "null"] }
    ContractAuditReport:
      type: object
      required: [id, status, prompt, startedAt, totalModels, completedModels, results]
      properties:
        id: { type: integer }
        status: { type: string, enum: [running, completed, failed] }
        prompt: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: ["string", "null"], format: date-time }
        totalModels: { type: integer }
        completedModels: { type: integer }
        results:
          type: array
          items:
            $ref: "#/components/schemas/ModelAuditResult"
        error: { type: ["string", "null"] }
    OverviewSummary:
      type: object
      required:
        [
          brandName,
          days,
          totalPrompts,
          totalRuns,
          totalRetrievals,
          visibilityPct,
          visibilityDelta,
          avgPosition,
          mentionRatePct,
          mentionRateDelta,
          lastRunAt,
        ]
      properties:
        brandName: { type: string }
        days: { type: integer }
        totalPrompts: { type: integer }
        totalRuns: { type: integer }
        totalRetrievals: { type: integer }
        visibilityPct: { type: number }
        visibilityDelta: { type: number }
        avgPosition: { type: ["number", "null"] }
        mentionRatePct: { type: number }
        mentionRateDelta: { type: number }
        lastRunAt: { type: ["string", "null"] }
    SimulateAllBody:
      type: object
      properties:
        companyId: { type: integer }
      required: [companyId]
    TrackingJob:
      type: object
      properties:
        id: { type: integer }
        companyId: { type: integer }
        promptId: { type: ["integer", "null"] }
        models:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/JobModelSnapshot"
        runDate: { type: string }
        trigger: { type: string, enum: [manual, scheduled] }
        status: { type: string, enum: [running, completed, failed] }
        totalSimulations: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        error: { type: ["string", "null"] }
        createdAt: { type: string }
        finishedAt: { type: ["string", "null"] }
      required:
        [id, companyId, runDate, trigger, status, totalSimulations, succeeded, failed, createdAt]
    ProgressPoint:
      type: object
      properties:
        date: { type: string }
        runs: { type: integer }
        retrievals: { type: integer }
        visibilityPct: { type: ["number", "null"] }
        avgBrandPosition: { type: ["number", "null"] }
        ownedCitations: { type: integer }
        competitorCitations: { type: integer }
        corporateCitations: { type: integer }
        directoryCitations: { type: integer }
        comparisonCitations: { type: integer }
        ugcCitations: { type: integer }
        editorialCitations: { type: integer }
        institutionalCitations: { type: integer }
        otherCitations: { type: integer }
      required:
        [date, runs, retrievals, visibilityPct, avgBrandPosition, ownedCitations, competitorCitations, corporateCitations, directoryCitations, comparisonCitations, ugcCitations, editorialCitations, institutionalCitations, otherCitations]
    ProgressEvent:
      type: object
      properties:
        date: { type: string }
        title: { type: string }
        category: { type: string, enum: [on_page, off_page] }
        status: { type: string }
      required: [date, title, category, status]
    ProgressMeasurement:
      type: object
      properties:
        weekOf: { type: string }
        shareOfVoicePct: { type: ["number", "null"] }
        brandMentions: { type: integer }
        competitorMentionsAvg: { type: ["number", "null"] }
        consensusAnswer: { type: ["boolean", "null"] }
        topPageType: { type: ["string", "null"] }
      required: [weekOf, shareOfVoicePct, brandMentions, competitorMentionsAvg, consensusAnswer, topPageType]
    ProgressSummary:
      type: object
      properties:
        visibilityPct: { type: ["number", "null"] }
        visibilityDelta: { type: ["number", "null"] }
        totalRuns: { type: integer }
        totalRetrievals: { type: integer }
        avgCitationsPerRun: { type: ["number", "null"] }
        avgBrandPosition: { type: ["number", "null"] }
        actionsLive: { type: integer }
        actionsInProgress: { type: integer }
        lastTrackedAt: { type: ["string", "null"] }
      required:
        [visibilityPct, visibilityDelta, totalRuns, totalRetrievals, avgCitationsPerRun, avgBrandPosition, actionsLive, actionsInProgress, lastTrackedAt]
    ProgressResponse:
      type: object
      properties:
        summary:
          $ref: "#/components/schemas/ProgressSummary"
        series:
          type: array
          items:
            $ref: "#/components/schemas/ProgressPoint"
        events:
          type: array
          items:
            $ref: "#/components/schemas/ProgressEvent"
        measurements:
          type: array
          items:
            $ref: "#/components/schemas/ProgressMeasurement"
      required: [summary, series, events, measurements]
    CaseStudyRecord:
      type: object
      properties:
        id: { type: integer }
        companyId: { type: integer }
        startingPosition: { type: ["string", "null"] }
        strategicFocus: { type: ["string", "null"] }
        contextNotes: { type: ["string", "null"] }
        contextUpdatedAt: { type: ["string", "null"] }
        createdAt: { type: string }
      required:
        [id, companyId, startingPosition, strategicFocus, contextNotes, contextUpdatedAt, createdAt]
    CaseStudyContextInput:
      type: object
      properties:
        companyId: { type: integer }
        startingPosition: { type: ["string", "null"], maxLength: 4000 }
        strategicFocus: { type: ["string", "null"], maxLength: 4000 }
        contextNotes: { type: ["string", "null"], maxLength: 4000 }
      required: [companyId]
    CaseStudyMetricWindow:
      type: object
      properties:
        start: { type: string }
        end: { type: string }
        runs: { type: integer }
        visibilityPct: { type: ["number", "null"] }
        avgBrandPosition: { type: ["number", "null"] }
        verifiedCitations: { type: integer }
        ownedCitations: { type: integer }
      required:
        [start, end, runs, visibilityPct, avgBrandPosition, verifiedCitations, ownedCitations]
    CaseStudyEvidenceSummary:
      type: object
      properties:
        totalRuns: { type: integer }
        activePrompts: { type: integer }
        firstRunAt: { type: ["string", "null"] }
        lastRunAt: { type: ["string", "null"] }
        earliest:
          oneOf:
            - $ref: "#/components/schemas/CaseStudyMetricWindow"
            - type: "null"
        latest:
          oneOf:
            - $ref: "#/components/schemas/CaseStudyMetricWindow"
            - type: "null"
        actionsLive: { type: integer }
        actionsInProgress: { type: integer }
        measurementCount: { type: integer }
        gaps:
          type: array
          items: { type: string }
      required:
        [totalRuns, activePrompts, firstRunAt, lastRunAt, earliest, latest, actionsLive, actionsInProgress, measurementCount, gaps]
    CaseStudyRevision:
      type: object
      properties:
        id: { type: integer }
        caseStudyId: { type: integer }
        companyId: { type: integer }
        revisionNumber: { type: integer }
        kind: { type: string, enum: [baseline, refresh] }
        narrative: { type: string }
        editedNarrative: { type: ["string", "null"] }
        approvedAt: { type: ["string", "null"] }
        periodStart: { type: ["string", "null"] }
        periodEnd: { type: ["string", "null"] }
        model: { type: ["string", "null"] }
        createdAt: { type: string }
        evidence:
          $ref: "#/components/schemas/CaseStudyEvidenceSummary"
      required:
        [id, caseStudyId, companyId, revisionNumber, kind, narrative, editedNarrative, approvedAt, periodStart, periodEnd, model, createdAt, evidence]
    CaseStudyRefreshInput:
      type: object
      properties:
        companyId: { type: integer }
      required: [companyId]
    CaseStudyRevisionUpdate:
      type: object
      properties:
        companyId: { type: integer }
        editedNarrative: { type: ["string", "null"], maxLength: 20000 }
        approved: { type: boolean }
      required: [companyId]
    CaseStudyJob:
      type: object
      properties:
        id: { type: integer }
        companyId: { type: integer }
        status: { type: string, enum: [running, completed, failed] }
        stage: { type: string }
        error: { type: ["string", "null"] }
        revisionId: { type: ["integer", "null"] }
        createdAt: { type: string }
        finishedAt: { type: ["string", "null"] }
      required:
        [id, companyId, status, stage, error, revisionId, createdAt, finishedAt]
    CaseStudyNewActivity:
      type: object
      properties:
        runs: { type: integer }
        actions: { type: integer }
        measurements: { type: integer }
      required: [runs, actions, measurements]
    CaseStudyOverview:
      type: object
      properties:
        caseStudy:
          $ref: "#/components/schemas/CaseStudyRecord"
        revisions:
          type: array
          items:
            $ref: "#/components/schemas/CaseStudyRevision"
        activeJob:
          oneOf:
            - $ref: "#/components/schemas/CaseStudyJob"
            - type: "null"
        lastJob:
          oneOf:
            - $ref: "#/components/schemas/CaseStudyJob"
            - type: "null"
        newActivity:
          oneOf:
            - $ref: "#/components/schemas/CaseStudyNewActivity"
            - type: "null"
        generationAvailable: { type: boolean }
      required:
        [caseStudy, revisions, activeJob, lastJob, newActivity, generationAvailable]
    TimeseriesPoint:
      type: object
      required: [date, runs, retrievals, visibilityPct]
      properties:
        date: { type: string }
        runs: { type: integer }
        retrievals: { type: integer }
        visibilityPct: { type: number }
    Prompt:
      type: object
      required: [id, text, topic, tags, models, active, createdAt, runCount, lastVisibilityPct, moneyTopicId, moneyTopicName]
      properties:
        id: { type: integer }
        text: { type: string }
        topic: { type: string }
        moneyTopicId: { type: ["integer", "null"] }
        moneyTopicName: { type: ["string", "null"] }
        tags:
          type: array
          items: { type: string }
        models:
          type: array
          items: { type: string }
        active: { type: boolean }
        createdAt: { type: string }
        runCount: { type: integer }
        lastVisibilityPct: { type: ["number", "null"] }
        lastRunAt: { type: ["string", "null"] }
    PromptDetail:
      allOf:
        - $ref: "#/components/schemas/Prompt"
        - type: object
          required: [recentRuns]
          properties:
            recentRuns:
              type: array
              items:
                $ref: "#/components/schemas/PromptRun"
    PromptInput:
      type: object
      required: [companyId, text, topic]
      properties:
        companyId: { type: integer }
        text: { type: string, minLength: 3 }
        topic: { type: string, minLength: 1 }
        moneyTopicId: { type: ["integer", "null"] }
        tags:
          type: array
          items: { type: string }
        models:
          type: array
          items: { type: string }
    PromptUpdate:
      type: object
      properties:
        text: { type: string, minLength: 3 }
        topic: { type: string, minLength: 1 }
        moneyTopicId: { type: ["integer", "null"] }
        tags:
          type: array
          items: { type: string }
        models:
          type: array
          items: { type: string }
        active: { type: boolean }
    SimulationRequest:
      type: object
      properties:
        model: { type: string }
    PromptRun:
      type: object
      required: [id, promptId, promptText, model, brandMentioned, createdAt, citationCount]
      properties:
        id: { type: integer }
        promptId: { type: integer }
        promptText: { type: string }
        model: { type: string }
        brandMentioned: { type: boolean }
        brandPosition: { type: ["integer", "null"] }
        createdAt: { type: string }
        citationCount: { type: integer }
        answerPreview: { type: ["string", "null"] }
        searchStatus:
          type: ["string", "null"]
          enum:
            [
              provider_cited,
              search_no_citations,
              extraction_failed,
              provider_search,
              unsupported,
              tool_rejected,
              null,
            ]
          description: "provider_cited = search + verified citations; search_no_citations = search performed, provider returned no citation metadata; extraction_failed = metadata present but unverifiable; provider_search = legacy search label (pre-outcome-model); null = legacy run (search behavior unknown)"
        citationEligible: { type: ["boolean", "null"] }
        visibilityRung:
          type: ["string", "null"]
          enum: [recommended, cited, mentioned, absent, null]
          description: "recommended = explicit pick/shortlist; cited = brand domain in verified citations; mentioned = name in prose without citation gravity; absent = neither; null = legacy unscored run"
    PromptRunDetail:
      allOf:
        - $ref: "#/components/schemas/PromptRun"
        - type: object
          required: [answerText, citations, citationDiagnostics]
          properties:
            answerText: { type: string }
            citations:
              type: array
              items:
                $ref: "#/components/schemas/Citation"
            citationDiagnostics:
              description: "Stored citation-extraction diagnostics for this run; null for legacy runs that predate diagnostics capture"
              oneOf:
                - $ref: "#/components/schemas/CitationDiagnostics"
                - type: "null"
    PromptInsights:
      type: object
      required: [companyId, summary, series, sourceTypes, sources, mentionedEntities, entityExtraction, modelCoverage]
      properties:
        companyId: { type: integer }
        summary:
          $ref: "#/components/schemas/PromptInsightsSummary"
        modelCoverage:
          type: array
          items:
            $ref: "#/components/schemas/PromptModelCoverage"
        series:
          type: array
          items:
            $ref: "#/components/schemas/PromptInsightsDay"
        sourceTypes:
          type: array
          items:
            $ref: "#/components/schemas/PromptSourceType"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/PromptSource"
        mentionedEntities:
          type: array
          description: "Named companies, organisations, products, and services explicitly extracted from saved model answers. Every name is grounded to a verbatim answer excerpt."
          items:
            $ref: "#/components/schemas/PromptMentionedEntity"
        entityExtraction:
          $ref: "#/components/schemas/PromptEntityExtractionSummary"
    PromptInsightsSummary:
      type: object
      required:
        [
          visibilityPct,
          visibilityDelta,
          totalRuns,
          totalRetrievals,
          citationEligibleRuns,
          avgCitationsPerRun,
          avgBrandPosition,
          lastRunAt,
        ]
      properties:
        visibilityPct: { type: ["number", "null"] }
        visibilityDelta: { type: ["number", "null"] }
        totalRuns: { type: integer }
        totalRetrievals: { type: integer }
        citationEligibleRuns: { type: integer }
        avgCitationsPerRun: { type: ["number", "null"] }
        avgBrandPosition: { type: ["number", "null"] }
        lastRunAt: { type: ["string", "null"] }
    PromptModelCoverage:
      type: object
      required: [model, runs, mentions, mentionRatePct, citations, citationEligibleRuns, failedAttempts, lastRunAt, sources]
      properties:
        model: { type: string }
        runs: { type: integer }
        mentions: { type: integer }
        mentionRatePct: { type: ["number", "null"] }
        citations: { type: integer }
        citationEligibleRuns: { type: integer }
        failedAttempts: { type: integer }
        lastRunAt: { type: ["string", "null"] }
        sources:
          type: array
          description: "Verified provider-provenance citation sources for this model, ranked by retrieval count. Associated-answer mention metrics describe the answers that used the source, not the cited page."
          items:
            $ref: "#/components/schemas/PromptModelCitationSource"
    PromptModelCitationSource:
      type: object
      required: [domain, domainType, topUrl, retrievals, sharePct, avgPosition, associatedAnswers, businessMentionedAnswers, businessMentionRatePct]
      properties:
        domain: { type: string }
        domainType: { type: string }
        topUrl: { type: ["string", "null"] }
        retrievals: { type: integer }
        sharePct: { type: number }
        avgPosition: { type: number }
        associatedAnswers: { type: integer }
        businessMentionedAnswers: { type: integer }
        businessMentionRatePct: { type: number }
    PromptInsightsDay:
      type: object
      required:
        [
          date,
          runs,
          retrievals,
          visibilityPct,
          avgBrandPosition,
          ownedCitations,
          competitorCitations,
          corporateCitations,
          directoryCitations,
          comparisonCitations,
          ugcCitations,
          editorialCitations,
          institutionalCitations,
          otherCitations,
        ]
      properties:
        date: { type: string }
        runs: { type: integer }
        retrievals: { type: integer }
        visibilityPct: { type: ["number", "null"] }
        avgBrandPosition: { type: ["number", "null"] }
        ownedCitations: { type: integer }
        competitorCitations: { type: integer }
        corporateCitations: { type: integer }
        directoryCitations: { type: integer }
        comparisonCitations: { type: integer }
        ugcCitations: { type: integer }
        editorialCitations: { type: integer }
        institutionalCitations: { type: integer }
