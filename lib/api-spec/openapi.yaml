openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AEO Intelligence Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: caseStudies
    description: Evolving client case studies with dated revisions
  - name: overview
    description: Dashboard overview aggregates
  - name: prompts
    description: Tracked test prompts
  - name: runs
    description: Prompt simulation runs
  - name: sources
    description: Domains, URLs and source distribution
  - name: signals
    description: On-page and off-page signals
  - name: siteTests
    description: Site Testing Zone lab
  - name: insights
    description: Rule-based findings computed from real run data
  - name: perception
    description: How AI engines describe the tracked brand
  - name: gap
    description: Prompts and sources where the brand is absent
  - name: discovery
    description: Prompt coverage and AI-suggested prompts
  - name: settings
    description: Competitor configuration and system status
  - name: companies
    description: Tracked companies (each scopes its own prompts, runs, and sources)
  - name: dashboard
    description: Cross-company industry intelligence
  - name: research
    description: Published-industry research datasets (curated, source-attributed)
  - name: strategy
    description: Strategy Ideas library and per-company 5-step AEO playbook
  - name: tracking
    description: Bulk prompt tracking runs and daily automation
  - name: progress
    description: AEO progress over time — visibility, citations, and action impact
paths:
  /research/aeo:
    get:
      operationId: getAeoResearch
      tags: [research]
      summary: Curated AEO/AI-citation-behaviour research dataset with source attribution
      responses:
        "200":
          description: Research dataset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AeoResearch"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /models:
    get:
      operationId: listModels
      tags: [health]
      summary: Available answer-engine models for simulation
      responses:
        "200":
          description: Model catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelInfo"
  /overview/summary:
    get:
      operationId: getOverviewSummary
      tags: [overview]
      summary: Headline visibility metrics for a company
      parameters:
        - name: companyId
          in: query
          required: true
          schema: { type: integer }
        - name: days
          in: query
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewSummary"
  /overview/timeseries:
    get:
      operationId: getOverviewTimeseries
      tags: [overview]
      summary: Daily visibility and retrieval counts
      parameters:
        - name: companyId
          in: query
          required: true
          schema: { type: integer }
        - name: days
          in: query
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: Daily points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeseriesPoint"
  /prompts/simulate-all:
    post:
      operationId: simulateAllPrompts
      tags: [tracking]
      summary: Run every active prompt for a company across its configured models
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateAllBody"
      responses:
        "200":
          description: Batch result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingJob"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: A batch is already running for this company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "503":
          description: Model API key not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /prompts/{id}/simulate-all:
    post:
      operationId: simulatePromptAllModels
      tags: [tracking]
      summary: Run one prompt across every enabled registry model as a durable server-side job
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Job started (poll /tracking/jobs?promptId=)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingJob"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Prompt not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: A run is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "503":
          description: Model API key not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /tracking/jobs/{id}/attempts:
    get:
      operationId: getTrackingJobAttempts
      tags: [tracking]
      summary: Per-model attempt outcomes for a job (exact partial-failure reporting)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Attempt counts grouped by model
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobModelAttempts"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /methodology:
    get:
      operationId: getMethodology
      tags: [dashboard]
      summary: Registry snapshot, coverage, sample sizes, and denominator rules for the selected window
      parameters:
        - name: companyId
          in: query
          schema: { type: integer }
        - name: days
          in: query
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: Methodology
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Methodology"
  /models/citation-quality:
    get:
      operationId: getCitationQuality
      tags: [models]
      summary: Per-model citation quality diagnostics over stored runs (outcome counts, verified citation yield, zero-citation eligible runs)
      parameters:
        - name: companyId
          in: query
          schema: { type: integer }
        - name: days
          in: query
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: Per-model citation quality report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitationQualityReport"
  /models/contract-audit:
    get:
      operationId: getContractAudit
      tags: [models]
      summary: Latest live provider contract audit report (operator-only; requires x-operator-token)
      parameters:
        - name: x-operator-token
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Contract audit report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractAuditReport"
        "401":
          description: Operator token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: No audit has been run yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    post:
      operationId: startContractAudit
      tags: [models]
      summary: Start a live provider contract audit (operator-only; durable cooldown between runs; triggers paid provider calls)
      parameters:
        - name: x-operator-token
          in: header
          required: true
          schema: { type: string }
      responses:
        "202":
          description: Audit started; poll GET /models/contract-audit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractAuditReport"
        "401":
          description: Operator token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: An audit is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "429":
          description: Durable cooldown between audits is still active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "503":
          description: Model gateway or operator auth not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /tracking/jobs:
    get:
      operationId: listTrackingJobs
      tags: [tracking]
      summary: Recent bulk tracking runs for a company
      parameters:
        - name: companyId
          in: query
          required: true
          schema: { type: integer }
        - name: promptId
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: Jobs, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrackingJob"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /progress:
    get:
      operationId: getProgress
      tags: [progress]
      summary: AEO progress over time with strategy-action milestones
      parameters:
        - name: companyId
          in: query
          required: true
          schema: { type: integer }
        - name: days
          in: query
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: Progress dataset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /case-study:
    get:
      operationId: getCaseStudy
      tags: [caseStudies]
      summary: A company's case study, revision history, job state, and new-activity counts
      parameters:
        - name: companyId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Case study overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseStudyOverview"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /case-study/context:
    put:
      operationId: saveCaseStudyContext
      tags: [caseStudies]
      summary: Save the authored starting position, strategic focus, and notes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseStudyContextInput"
      responses:
        "200":
          description: Saved case study
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseStudyRecord"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /case-study/refresh:
    post:
      operationId: refreshCaseStudy
      tags: [caseStudies]
      summary: Start a background narrative refresh (poll /case-study/jobs)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseStudyRefreshInput"
      responses:
        "202":
          description: Refresh job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseStudyJob"
        "409":
          description: A refresh is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "503":
          description: Generation unavailable (no model key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /case-study/jobs:
    get:
      operationId: listCaseStudyJobs
      tags: [caseStudies]
      summary: Recent case-study refresh jobs for a company, newest first
      parameters:
        - name: companyId
          in: query
          required: true
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, default: 5 }
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaseStudyJob"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /case-study/revisions/{id}:
    patch:
      operationId: updateCaseStudyRevision
      tags: [caseStudies]
      summary: Edit the wording of a revision or approve/unapprove it
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseStudyRevisionUpdate"
      responses:
        "200":
          description: Updated revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseStudyRevision"
        "404":
          description: Revision not found for this company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /prompts:
    get:
      operationId: listPrompts
      tags: [prompts]
      summary: List tracked prompts for a company
      parameters:
        - name: companyId
          in: query
          required: true
          schema: { type: integer }
        - name: topic
          in: query
          schema: { type: string }
        - name: tag
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Prompts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prompt"
    post:
      operationId: createPrompt
      tags: [prompts]
      summary: Add a prompt to track
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prompt"
  /prompts/{id}:
    get:
      operationId: getPrompt
      tags: [prompts]
      summary: Get a prompt with its latest run stats
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Prompt detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    patch:
      operationId: updatePrompt
      tags: [prompts]
      summary: Update a prompt
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prompt"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: deletePrompt
      tags: [prompts]
      summary: Delete a prompt
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
  /prompts/{id}/simulate:
    post:
      operationId: simulatePrompt
      tags: [prompts]
      summary: Run the prompt against a real AI model and record the answer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationRequest"
      responses:
        "201":
          description: Recorded run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptRun"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /prompts/{id}/runs:
    get:
      operationId: listPromptRuns
      tags: [runs]
      summary: All recorded runs for a prompt
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromptRun"
  /prompts/{id}/insights:
    get:
      operationId: getPromptInsights
      tags: [prompts]
      summary: Prompt-level tracking insights (visibility over time, sources, source types)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 7, maximum: 365, default: 30 }
      responses:
        "200":
          description: Prompt insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptInsights"
        "404":
          description: Prompt not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: Recent simulation runs for a company
      parameters:
        - name: companyId
          in: query
          required: true
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, default: 25 }
        - name: model
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Recent runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromptRun"
  /runs/{id}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Full run detail including answer text and citations
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptRunDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /sources/domains:
    get:
      operationId: listDomains
      tags: [sources]
      summary: Domains that contribute to AI answers, ranked by retrievals
      parameters:
        - name: companyId
          in: query
          required: true
          schema: { type: integer }
        - name: view
          in: query
          schema:
            type: string
            enum: [top, new, trending, losing]
            default: top
        - name: days
          in: query
          schema: { type: integer, default: 30 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Domains
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DomainStat"
  /sources/domain-types:
    get:
      operationId: getDomainTypeDistribution
      tags: [sources]
      summary: Retrieval share by domain type
      parameters:
        - name: companyId
          in: query
          required: true
          schema: { type: integer }
        - name: days
          in: query
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: Distribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainTypeDistribution"
  /sources/urls:
    get:
      operationId: listUrls
      tags: [sources]
      summary: Individual URLs cited in AI answers
      parameters:
        - name: companyId
          in: query
          required: true
          schema: { type: integer }
        - name: days
          in: query
          schema: { type: integer, default: 30 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: URLs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UrlStat"
  /signals:
    get:
      operationId: listSignals
      tags: [signals]
      summary: Company-grounded on-page and off-page action recommendations
      parameters:
        - name: companyId
          in: query
          required: true
          schema: { type: integer }
        - name: category
          in: query
          schema:
            type: string
            enum: [on_page, off_page]
      responses:
        "200":
          description: Signals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Signal"
  /site-tests:
    get:
      operationId: listSiteTests
      tags: [siteTests]
      summary: Sites tracked in the Site Testing Zone for one company
      parameters:
        - name: companyId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Site tests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SiteTest"
    post:
      operationId: createSiteTest
      tags: [siteTests]
      summary: Add a site to the testing lab
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteTestInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteTest"
  /site-tests/{id}:
    get:
      operationId: getSiteTest
      tags: [siteTests]
      summary: Site test with snapshot history (must belong to the company)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: companyId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Site test detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteTestDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: deleteSiteTest
      tags: [siteTests]
      summary: Remove a site from the lab (must belong to the company)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: companyId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
  /site-tests/{id}/audit:
    post:
      operationId: runSiteAudit
      tags: [siteTests]
      summary: Fetch the live site and record a real on-page AEO audit snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: companyId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "201":
          description: New snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSnapshot"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "502":
          description: Site unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /insights:
    get:
      operationId: listInsights
      tags: [insights]
      summary: Findings computed from real runs and citations (no AI, no estimates)
      parameters:
        - name: companyId
          in: query
          required: true
          schema: { type: integer }
        - name: days
          in: query
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: Insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Insight"
  /perception:
    get:
      operationId: getPerception
      tags: [perception]
      summary: Per-model brand mention rates with verbatim answer excerpts
      parameters:
        - name: companyId
          in: query
          required: true
          schema: { type: integer }
        - name: days
          in: query
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: Perception by model
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PerceptionModel"
  /gap-analysis:
    get:
      operationId: getGapAnalysis
