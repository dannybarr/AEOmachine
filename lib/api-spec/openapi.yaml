        rationale: { type: ["string", "null"] }
        sourceTitle: { type: ["string", "null"] }
        sourceUrl: { type: ["string", "null"] }
        observedAt: { type: ["string", "null"] }
        confidence: { type: string, enum: [observed, curated, hypothesis] }
